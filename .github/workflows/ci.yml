# Workflow CI — étape 1 : tests + rapports de couverture
# Déclenché sur chaque pull request vers main (validation obligatoire avant merge)
# et sur chaque push sur main.
name: CI - Tests & Coverage

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # Back-end : Spring Boot / Java 11 / Maven + JaCoCo
  # ---------------------------------------------------------------
  backend-tests:
    name: Back-end - Tests & couverture (JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Lancement des tests (+ rapport JaCoCo)
        run: mvn -B clean verify

      - name: Publication du rapport de couverture back
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: back/target/site/jacoco/
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # Front-end : Angular 14 / Karma + Jasmine
  # ---------------------------------------------------------------
  frontend-tests:
    name: Front-end - Tests & couverture (Karma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js 16
        uses: actions/setup-node@v4
        with:
          node-version: '16'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Lancement des tests (+ rapport de couverture)
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage

      - name: Publication du rapport de couverture front
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: front/coverage/bobapp/
          if-no-files-found: warn
